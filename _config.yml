# GitHub Pages renders README.md as the site's front page.
# Matching the title to the README's own heading stops the theme from printing
# a second header above it, and the image is the preview card shared links show.
title: Music Theory Studio
description: A free music theory course and a set of interactive theory tools, on piano or guitar, in your browser.
theme: jekyll-theme-primer
defaults:
  - scope:
      path: ""
    values:
      image: /media/lesson-in-studio.jpg
